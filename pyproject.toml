[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "danmukuflow"
version = "0.1.0"
description = "Convert Bilibili XML danmaku files to ASS subtitles."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "DanmukuFlow contributors" }
]
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.24",
    "protobuf>=4.21",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27,<1",
]

[project.scripts]
danmukuflow = "danmukuflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
